<div class="flex flex-col items-center px-40 mt-10">
  @if(isEdit){
  <h1 class="text-2xl">Update Catgory</h1>
  }@else{
  <h1 class="text-2xl">Add New Catgory</h1>
  }
  <form class="shadow-sm w-96 p-4">
    <div class="flex flex-wrap">
      <div class="w-full gap-4">
        <mat-form-field class="w-full" appearance="outline">
          <mat-label>Category Name</mat-label>
          <input matInput type="text" [(ngModel)]="name" name="name" />
        </mat-form-field>
      </div>
      <div class="w-full flex justify-center">
        @if(isEdit){
        <button
          [disabled]="!name"
          mat-raised-button
          class="!bg-blue-600 !text-white !rounded-full px-6 py-2 font-medium shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 mr-4"
          (click)="update()"
        >
          Update
        </button>
        }@else{
        <button
          [disabled]="!name"
          mat-raised-button
          class="!bg-blue-600 !text-white !rounded-full px-6 py-2 font-medium shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 mr-4"
          (click)="add()"
        >
          Add
        </button>
        }
      </div>
    </div>
  </form>
</div>
