<div class="flex flex-col items-center px-40 mt-10">
  <h1>Add New Product</h1>
  <form class="shadow-md p-4">
    <div class="flex flex-wrap">
      <mat-form-field class="w-full">
        <mat-label>Name</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Short Description</mat-label>
        <input matInput type="text" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Description</mat-label>
        <textarea matInput type="text" rows="5"></textarea>
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Price</mat-label>
        <input matInput type="number" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Discount</mat-label>
        <input matInput type="number" />
      </mat-form-field>
      <div class="w-full flex">
        <h4>Images</h4>
        <mat-form-field class="w-full flex-col">
          <mat-label>Images 1</mat-label>
          <input matInput type="text" />
        </mat-form-field>
      </div>
    </div>
    <div class="flex justify-center">
      <button mat-raised-button color="primary" (click)="addProduct()">Add</button>
    </div>
  </form>
</div>
