<div class="flex flex-col items-center px-40 mt-10">
  <h1>Add New Product</h1>
  <form class="shadow-md p-4" [formGroup]="productForm">
    <div class="flex flex-wrap">
      <mat-form-field class="w-full">
        <mat-label>Category</mat-label>
        <mat-select formControlName="categoryId" Class="fix-select-panel">
          @for(item of categories; track $index){
          <mat-option [value]="item._id">{{ item.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Brand</mat-label>
        <mat-select formControlName="brandId">
          @for(item of brands; track $index){
          <mat-option [value]="item._id">{{ item.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Name</mat-label>
        <input matInput type="text" formControlName="name" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Short Description</mat-label>
        <input matInput type="text" formControlName="shortDescription" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Description</mat-label>
        <textarea matInput type="text" rows="5" formControlName="description"></textarea>
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" />
      </mat-form-field>
      <mat-form-field class="w-full">
        <mat-label>Discount</mat-label>
        <input matInput type="number" formControlName="discount" />
      </mat-form-field>
      <div class="w-full flex flex-col" formArrayName="images">
        <div class="flex justify-between">
          <h4>Images</h4>
          <button
            class="!bg-blue-600 !text-white !rounded-full px-6 py-2 font-medium shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 mr-4"
            mat-raised-button
            color="primary"
            (click)="addImage()"
          >
            Add Images
          </button>
          <button
            class="!bg-red-600 !text-white !rounded-full px-6 py-2 font-medium shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 mr-4"
            mat-raised-button
            color="primary"
            (click)="removeImage()"
          >
            Remove Images
          </button>
        </div>
        @for(item of images.controls; track $index){
        <mat-form-field class="w-full flex-col">
          <mat-label>Images {{ $index + 1 }}</mat-label>
          <input matInput type="text" [formControlName]="$index" />
        </mat-form-field>
        }
      </div>
    </div>
    <div class="flex justify-center">
      <button
        class="!bg-blue-600 !text-white !rounded-full px-6 py-2 font-medium shadow-md hover:shadow-lg hover:bg-blue-700 active:scale-95 transition-all duration-200 mr-4"
        mat-raised-button
        color="primary"
        [disabled]="productForm.invalid"
        (click)="addProduct()"
      >
        Add
      </button>
    </div>
  </form>
</div>
